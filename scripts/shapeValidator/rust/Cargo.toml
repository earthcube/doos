[package]
name = "shacl-validate-oxi"
version = "0.1.0"
edition = "2021"
authors = ["EarthCube DOOS"]
description = "High-performance SHACL validator using rudof + Oxigraph (Rust port of validateToOxigraph.py)"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
oxigraph = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
governor = { version = "0.6", features = ["jitter"] }  # Rate limiting with jitter
rudof_lib = "0.3"                   # SHACL engine
anyhow = "1"
thiserror = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
