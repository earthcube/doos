# Sources to load into the in-memory Oxigraph server (see build/Dockerfile).
#
# Each source declares:
#   name    - label used for progress/logging
#   path    - file OR directory, relative to the repo root (or absolute)
#   format  - one of: nt, nq, ttl, trig, jsonld
#   graph   - target named graph IRI (see rules below)
#
# Named-graph rules:
#   - Triple formats (nt, ttl, jsonld): `graph` is REQUIRED. The whole payload
#     is loaded into that named graph.
#   - Quad formats (nq, trig) WITHOUT `graph`: embedded graph names from the
#     data are preserved (typical for OBIS / BODC multi-graph harvests).
#   - Quad formats (nq, trig) WITH `graph`: overrides embedded graphs — all
#     triples are collapsed into the given IRI (payload is converted to
#     N-Triples and POSTed with ?graph=). Use when you want one provider
#     graph (e.g. urn:doos:obis) instead of per-dataset graphs.
#
# Note: override only affects this load. It does not drop graphs already in
# the store from a previous run. POST appends; clear the store (or restart
# in-memory Oxigraph) if you need a clean slate.
#
# Output locations are taken from projects/dataLocations.md. BCO-DMO N-Triples are
# published under skills/bco-dmo-scan/output/output.nt.

endpoint: http://localhost:7878

sources:
  - name: argo
    path: projects/ARGO/data/output # directory of per-profile .nt files
    format: nt
    graph: urn:doos:argo

  - name: obis
    path: projects/OBIS/output.nq # consolidated N-Quads (carries graph names)
    format: nq
    # Omit graph to keep per-dataset graphs (http://oceaninfohub.org/graph/obisdepth/...).
    # Uncomment to collapse into one named graph:
    graph: urn:doos:obis

  - name: aodn
    path: projects/AODN/output/output.json
    format: jsonld
    graph: urn:doos:aodn

  - name: bodc
    path: projects/BODC/output/bodc_harvest.nq
    format: nq
    # Omit graph to keep per-series graphs (urn:doos:bodc:harvest:...).
    # Uncomment to collapse into one named graph:
    graph: urn:doos:bodc

  - name: bcodmo
    path: skills/bco-dmo-scan/output/output.nt
    format: nt
    graph: urn:doos:bcodmo
